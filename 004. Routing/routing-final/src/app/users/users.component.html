<div class="row">
  <div class="col-xs-12 col-sm-4">
    <div class="list-group">
      @for (user of users; track user) {
        <a
          [routerLink]="['/users', user.id, user.name]"
          href="#"
          class="list-group-item"
          >
          {{ user.name }}
        </a>
      }
    </div>
  </div>
  <div class="col-xs-12 col-sm-4">
    <router-outlet></router-outlet>
  </div>
</div>
