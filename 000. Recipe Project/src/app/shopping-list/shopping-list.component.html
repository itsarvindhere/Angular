<div class="row">
  <div class="col-xs-10">
    <app-shopping-edit></app-shopping-edit>
    <hr>
      @if (ingredients.length > 0) {
        <ul class="list-group">
          @for (ingredient of ingredients; track ingredient; let i = $index) {
            <a class="list-group-item d-flex justify-content-between" style="cursor: pointer;"
              >
              {{ingredient.name}} ({{ingredient.amount}})
              <div class="d-flex gap-2">
                <button class="btn btn-warning" (click)="editIngredient(i)">
                  <svg lucidePencil></svg>
                </button>
                <button class="btn btn-danger" (click)="deleteIngredient(i)">
                  <svg lucideTrash2></svg>
                </button>
              </div>
            </a>
          }
        </ul>
      } @else {
        <p>Your Shopping List is Empty!</p>
      }

    </div>
  </div>
